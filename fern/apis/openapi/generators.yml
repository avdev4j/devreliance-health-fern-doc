# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json

api:
  specs:
    # The spec is vendored here so every upstream change lands as a reviewable
    # diff. Do not hand-edit openapi.yaml — `fern api update` overwrites it from
    # `origin` (see .github/workflows/sync-openapi.yml).
    - openapi: openapi.yaml
      origin: https://raw.githubusercontent.com/healthcare-org-app/healthcare-prescriptions/main/openapi.yaml
